// عرض صورة أو رسالة "غير متوفرة"
function renderShot(name, label) {
  if (!name) return '';
  return `
    <div class="shot-wrap">
      <p class="shot-label"><i class="fa-solid fa-image"></i> ${label || 'صورة توضيحية'} — <span>انقر على الصورة لتكبيرها 🔍</span></p>
      <img src="screenshots/${name}.png" alt="${label||''}" class="shot-img" 
           onclick="openLightbox(this.src)" 
           onerror="this.style.display='none';this.nextElementSibling.style.display='block'">
      <div class="shot-missing" style="display:none">
        <i class="fa-solid fa-camera" style="font-size:2rem;margin-bottom:.5rem"></i>
        <p style="margin:0;font-weight:700">الصورة غير متوفرة بعد</p>
        <p style="margin:.5rem 0 0;font-size:.85rem">احفظ لقطة الشاشة باسم: <code>screenshots/${name}.png</code></p>
      </div>
    </div>`;
}

function renderChaptersList() {
  document.getElementById('chaptersList').innerHTML = GUIDE.map(ch => `
    <button class="chapter-btn ${ch.id === currentChapter ? 'active' : ''}" data-id="${ch.id}" onclick="selectChapter('${ch.id}')">
      <i class="fa-solid ${ch.icon}" style="color:${ch.id === currentChapter ? '#fff' : ch.c1}"></i>
      ${ch.title}
    </button>
  `).join('');
}

function renderContent(chapterId) {
  const ch = GUIDE.find(g => g.id === chapterId) || GUIDE[0];
  const content = document.getElementById('content');
  content.innerHTML = `
    <div class="chapter-header" style="--c1:${ch.c1};--c2:${ch.c2}">
      <h2><i class="fa-solid ${ch.icon}"></i> ${ch.title}</h2>
      ${ch.intro ? `<p>${ch.intro}</p>` : ''}
    </div>
    ${ch.image ? `<div class="card">${renderShot(ch.image, 'صورة توضيحية')}</div>` : ''}
    ${ch.sections.map(s => `
      <div class="section" style="--c1:${ch.c1}">
        <h3>${s.title}</h3>
        ${s.image ? renderShot(s.image, 'صورة توضيحية') : ''}
        <p>${s.desc}</p>
        ${s.list ? `<ul class="list">${s.list.map(l => `<li>${l}</li>`).join('')}</ul>` : ''}
        ${s.steps ? `<div class="steps"><p class="steps-title"><i class="fa-solid fa-list-ol"></i> الخطوات:</p><ol>${s.steps.map(st => `<li>${st}</li>`).join('')}</ol></div>` : ''}
        ${s.location ? `<p class="location"><i class="fa-solid fa-location-dot"></i> <b>المسار:</b> ${s.location}</p>` : ''}
        ${s.tip ? `<p class="tip"><i class="fa-solid fa-lightbulb"></i> <b>نصيحة:</b> ${s.tip}</p>` : ''}
      </div>
    `).join('')}
  `;
  content.scrollTop = 0;
}

function selectChapter(id) {
  currentChapter = id;
  renderChaptersList();
  renderContent(id);
}

function filterChapters() {
  const q = (document.getElementById('searchBox').value || '').toLowerCase();
  document.querySelectorAll('.chapter-btn').forEach(btn => {
    const ch = GUIDE.find(g => g.id === btn.dataset.id);
    if (!ch) return;
    const matches = ch.title.toLowerCase().includes(q) ||
      ch.sections.some(s => s.title.toLowerCase().includes(q) || (s.desc||'').toLowerCase().includes(q));
    btn.style.display = matches ? 'flex' : 'none';
  });
}

function openLightbox(src) {
  document.getElementById('lightboxImg').src = src;
  document.getElementById('lightbox').classList.add('on');
}
function closeLightbox() {
  document.getElementById('lightbox').classList.remove('on');
}
document.addEventListener('keydown', e => { if (e.key === 'Escape') closeLightbox(); });

function printGuide() {
  window.print();
}

// التشغيل
renderChaptersList();
renderContent('intro');
</script>
</body>
</html>
